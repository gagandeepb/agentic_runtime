services:
  postgres:
    image: postgres:16-alpine
    container_name: agentic_runtime_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentic_runtime_test
    ports:
      - "5432:5432"
    volumes:
      - agentic_runtime_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  agentic_runtime_pg:
